<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Species model gallery — Field Guide</title>
<style>
  :root {
    --ink: #1f2022; --paper: #f9f9f9; --green: #45c223; --green-deep: #008653;
    --mustard: #f6b22d; --grid: #e4e7e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: Montserrat, "Avenir Next", "Century Gothic", sans-serif;
    display: flex; height: 100vh; overflow: hidden;
  }
  #side {
    width: 320px; min-width: 280px; border-right: 2px solid var(--grid);
    display: flex; flex-direction: column; background: #fff;
  }
  #side header { padding: 16px 16px 10px; }
  #side h1 { font-size: 17px; margin: 0 0 4px; font-weight: 800; }
  #side h1 span { color: var(--green-deep); }
  #stats { font-size: 11px; color: #666; line-height: 1.5; }
  #search {
    margin: 8px 16px 8px; padding: 9px 12px; border: 2px solid var(--grid);
    border-radius: 999px; font: inherit; font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--green); }
  #filters { padding: 0 16px 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  #filters button {
    border: 1.5px solid var(--grid); background: #fff; border-radius: 999px;
    font: inherit; font-size: 11px; padding: 3px 9px; cursor: pointer; color: #444;
  }
  #filters button.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 700; }
  #list { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  #list button {
    display: flex; width: 100%; align-items: center; gap: 8px; text-align: left;
    background: none; border: 0; border-radius: 12px; padding: 7px 10px;
    font: inherit; cursor: pointer; color: var(--ink);
  }
  #list button:hover { background: #f2f6f0; }
  #list button.on { background: #e8f6e0; }
  #list .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--green-deep); }
  #list .nm { flex: 1; min-width: 0; }
  #list .nm b { display: block; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .nm i { font-size: 10.5px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  #list .ct { font-size: 10.5px; color: #999; }
  #stage { flex: 1; position: relative; background:
    radial-gradient(120% 90% at 50% 0%, #ffffff 0%, var(--paper) 60%, #eef2ea 100%); }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #plate {
    position: absolute; left: 18px; bottom: 16px; pointer-events: none;
  }
  #plate b { font-size: 22px; font-weight: 800; display: block; }
  #plate i { font-size: 13px; color: #555; display: block; font-style: italic; }
  #plate .meta { font-size: 11px; color: #777; margin-top: 4px; }
  #plate .meta em { font-style: normal; background: #fff; border: 1.5px solid var(--grid); border-radius: 999px; padding: 2px 8px; margin-right: 4px; display: inline-block; }
  #controls {
    position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px;
  }
  #controls button {
    font: inherit; font-weight: 700; border: 2px solid var(--ink); background: #fff;
    color: var(--ink); border-radius: 999px; padding: 8px 14px; cursor: pointer;
    box-shadow: 0 3px 0 var(--ink);
  }
  #controls button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  #controls button.on { background: var(--green); border-color: var(--green-deep); box-shadow: 0 3px 0 var(--green-deep); }
  #loadmsg { position: absolute; inset: 0; display: grid; place-items: center; color: #888; font-size: 13px; }
  #credit {
    position: absolute; top: 12px; right: 16px; font-size: 10px; color: #999;
    text-align: right; max-width: 380px; line-height: 1.5;
  }
  body.shot #side, body.shot #controls, body.shot #plate .meta, body.shot #credit { display: none; }
  body.shot { background: transparent; }
  body.shot #stage { background: transparent; }
</style>
</head>
<body>
  <nav id="side">
    <header>
      <h1>Field Guide <span>· species models</span></h1>
      <div id="stats">loading…</div>
    </header>
    <input id="search" type="search" placeholder="search name or science…" />
    <div id="filters"></div>
    <div id="list"></div>
  </nav>
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="loadmsg">pick a species →</div>
    <div id="plate"><b id="pname"></b><i id="psci"></i><div class="meta" id="pmeta"></div></div>
    <div id="controls">
      <button id="prev" title="previous">‹</button>
      <button id="play" title="auto-advance">▶ play</button>
      <button id="next" title="next">›</button>
    </div>
    <div id="credit"></div>
  </main>
<script type="module" src="/model-gallery.js"></script>
</body>
</html>
