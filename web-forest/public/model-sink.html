<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitchen sink — every species model</title>
<style>
  :root {
    --ink: #1f2022; --paper: #f9f9f9; --green: #45c223; --green-deep: #008653;
    --mustard: #f6b22d; --grid: #e4e7e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Montserrat, "Avenir Next", "Century Gothic", sans-serif;
  }

  /* The single canvas everything is drawn into, pinned behind the scrolling
     grid. One WebGL context, not one per tile — see model-sink.js. */
  #gl {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none; z-index: 0;
  }

  header {
    position: sticky; top: 0; z-index: 3; background: rgba(249,249,249,0.94);
    backdrop-filter: blur(8px); border-bottom: 2px solid var(--grid);
    padding: 12px 18px 10px;
  }
  h1 { font-size: 17px; margin: 0 0 2px; font-weight: 800; }
  h1 span { color: var(--green-deep); }
  #stats { font-size: 11px; color: #666; line-height: 1.5; }
  #stats b { color: var(--ink); }

  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 9px; }
  input[type=search] {
    padding: 8px 13px; border: 2px solid var(--grid); border-radius: 999px;
    font: inherit; font-size: 13px; outline: none; min-width: 210px;
  }
  input[type=search]:focus { border-color: var(--green); }
  button.chip {
    border: 1.5px solid var(--grid); background: #fff; border-radius: 999px;
    font: inherit; font-size: 11px; padding: 4px 10px; cursor: pointer; color: #444;
  }
  button.chip.on { background: var(--green); border-color: var(--green); color: #fff; font-weight: 700; }
  label.slider { font-size: 11px; color: #666; display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 116px; }

  #grid {
    position: relative; z-index: 2;
    display: grid; gap: 10px; padding: 14px 18px 60px;
  }
  .cell {
    position: relative; border: 1.5px solid var(--grid); border-radius: 16px;
    background: transparent; overflow: hidden; aspect-ratio: 1 / 1;
  }
  /* The tile art is drawn by the canvas underneath; this layer only carries
     the frame, the label and the loading state. */
  .cell .plate {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px 7px;
    background: linear-gradient(to top, rgba(249,249,249,0.97) 62%, rgba(249,249,249,0));
    pointer-events: none;
  }
  .cell .plate b {
    display: block; font-size: 11px; font-weight: 700; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell .plate i {
    display: block; font-size: 9.5px; color: #777; font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell .tag {
    position: absolute; top: 6px; right: 7px; font-size: 8.5px; font-weight: 700;
    border-radius: 999px; padding: 2px 6px; background: #fff;
    border: 1.5px solid var(--grid); color: #666;
  }
  .cell .tag.native { border-color: var(--green); color: var(--green-deep); }
  .cell .tag.derived { border-color: var(--mustard); color: #8a6a12; }
  .cell.pending::after {
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--grid); border-top-color: var(--green);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.no-label .plate, body.no-label .tag { display: none; }

  #empty { padding: 40px 18px; color: #777; font-size: 13px; position: relative; z-index: 2; }
  footer {
    position: relative; z-index: 2; padding: 18px; font-size: 10.5px;
    color: #888; line-height: 1.5; border-top: 2px solid var(--grid);
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<header>
  <h1>Kitchen sink — <span>every species model</span></h1>
  <div id="stats">loading manifest…</div>
  <div class="row">
    <input type="search" id="q" placeholder="Search name, species or archetype…" />
    <label class="slider">tile
      <input type="range" id="size" min="90" max="260" step="10" value="140" />
    </label>
    <button class="chip on" id="spin">spinning</button>
    <button class="chip on" id="labels">labels</button>
    <button class="chip" id="anim">idle anim</button>
  </div>
  <div class="row" id="filters"></div>
</header>

<div id="grid"></div>
<div id="empty" hidden>Nothing matches that.</div>

<footer>
  Species list: iNaturalist observations, &copy; iNaturalist users, CC-BY-NC. Models generated by this project
  (<code>script/build-species-model.mjs</code>). Nothing here is a survey, and no model is a photograph of a
  specific tree on campus.
</footer>

<script type="module" src="/model-sink.js"></script>
</body>
</html>
